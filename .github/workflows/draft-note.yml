name: Draft research note

# Runs a study pipeline, has Claude draft a note from its facts, checks every
# number, and opens a pull request for editorial review. Needs the repository
# secret ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      study:
        description: "Study to write about"
        required: true
        default: "utah-roi"
        type: choice
        options: ["utah-roi"]
      topic:
        description: "What the note should explain"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[dev,draft]"
      - name: Draft note
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STUDY: ${{ inputs.study }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set +e
          folder=$(lpresearch draft "$STUDY" --topic "$TOPIC")
          status=$?
          set -e
          if [ -z "$folder" ]; then exit 1; fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "numbers_ok=$([ $status -eq 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      # Pull requests opened with GITHUB_TOKEN do not start other workflows, so run the CI note check here.
      - name: Check notes
        id: check
        continue-on-error: true
        run: lpresearch check-notes | tee check.txt
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          FOLDER: ${{ steps.draft.outputs.folder }}
          TOPIC: ${{ inputs.topic }}
          NUMBERS_OK: ${{ steps.draft.outputs.numbers_ok }}
        run: |
          rel="${FOLDER#"$GITHUB_WORKSPACE"/}"
          branch="note/$(basename "$rel")"
          title=$(sed -n 's/^title: "\(.*\)"$/\1/p' "$FOLDER/note.md")
          git config user.name "LaborPulse Research Desk"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$rel"
          git commit -m "Draft note: $title"
          git push -u origin "$branch"
          {
            echo "Drafted by Claude for the topic: $TOPIC"
            echo
            if [ "$NUMBERS_OK" = "yes" ]; then
              echo "Every number in the note matches a fact computed by the pipeline."
            else
              echo "**Some numbers still do not match a fact. Fix them before merging.**"
            fi
            echo
            echo '```'
            cat check.txt
            echo '```'
            echo
            echo "Review for accuracy of interpretation, caveats and tone. Merging publishes the note."
          } > body.md
          gh pr create --title "Note: $title" --body-file body.md --head "$branch" --base main
