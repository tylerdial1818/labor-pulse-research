name: Research feeds

# Weekly: gather candidate AI-and-labor research from open feeds (no API keys)
# into ai_impact/candidates/<date>.json. Candidates are not published; a monthly
# curation PR to ai_impact/featured.json is the editorial step.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-feeds
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Collect candidates
        run: lpresearch feeds collect --since-days 10
      - name: Commit candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_impact/candidates
          if git diff --cached --quiet; then
            echo "No new candidates."
          else
            git commit -m "Research feed candidates $(date -u +%F)"
            git push
          fi
