[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lpresearch"
version = "0.1.0"
description = "LaborPulse Research Desk: reproducible labor-market analyses and fact-checked research notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
draft = ["anthropic>=2.12,<3"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
lpresearch = "lpresearch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lpresearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs the full 10,000-draw simulation"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
